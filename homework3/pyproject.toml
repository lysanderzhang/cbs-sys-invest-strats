[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finc9339-homework3"
version = "1.0.0"
description = "Reproducible daily G10 FX carry research"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "pandas>=2.2", "scipy>=1.14", "matplotlib>=3.9", "openpyxl>=3.1", "pypdf>=5", "pytest>=8"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
